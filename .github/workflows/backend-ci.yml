name: Backend Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m nabhniti.experiments --preset smoke --out ../results/ci_smoke.csv
        working-directory: backend

      - name: Verify archived research dataset
        run: python tools/verify_results.py
      - name: Independently check 1,000 shortest paths
        run: python tools/verify_routing.py --cases 1000 --out /tmp/nabh-routing-ci.json
